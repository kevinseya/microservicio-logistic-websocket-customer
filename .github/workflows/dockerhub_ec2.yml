name: CI/CD to EC2

on:
  push:
    branches: ["test"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t kevinseya/logistic_websocket_customer:latest .

      - name: Push Docker Image
        run: |
          echo "Pushing Docker image to Docker Hub..."
          docker push kevinseya/logistic_websocket_customer:latest

  deploy-to-ec2:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key for EC2 access
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: SSH into EC2 and deploy container
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_PUBLIC_DNS }} << 'EOF'
            # Verificar e instalar Docker si es necesario.
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Bajar la imagen
            sudo docker pull kevinseya/logistic_websocket_customer:latest

            # Detener y eliminar contenedor anterior
            sudo docker stop logistic_websocket_customer || true
            sudo docker rm logistic_websocket_customer || true

            # Generar archivo .env
            echo "COUCHDB_URL=${{ secrets.COUCHDB_URL }}" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "SQL_SERVER_HOST=${{ secrets.SQL_SERVER_HOST }}" >> .env
            echo "SQL_SERVER_PASSWORD=${{ secrets.SQL_SERVER_PASSWORD }}" >> .env
            echo "SQL_SERVER_PORT=${{ secrets.SQL_SERVER_PORT }}" >> .env
            echo "SQL_SERVER_USER=${{ secrets.SQL_SERVER_USER }}" >> .env
            echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
            echo "POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}" >> .env

            # Ejecutar nuevo contenedor
            sudo docker run -d --name logistic_websocket_customer \
              --env-file .env \
              -p 3002:3002 \
              kevinseya/logistic_websocket_customer:latest
          EOF